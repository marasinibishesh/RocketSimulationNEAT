[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "falcon9-neat-sim"
version = "1.0.0"
description = "From-scratch NEAT autonomous Falcon 9 inspired booster landing simulator with a procedural 3-D Panda3D visualization."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Open-source project contributors"}]
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6.0,<7",
  "panda3d>=1.10.14,<1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
falcon9-neat = "falcon9_neat.cli:main"
falcon9-train = "falcon9_neat.cli:train_main"
falcon9-evaluate = "falcon9_neat.cli:evaluate_main"
falcon9-demo = "falcon9_neat.cli:demo_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
